<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>存档：十六岁</title>
<style>
:root{--bg:#0b0c10;--fg:#d8d6cf;--amber:#d9a45b;--ai:#7fc4d8;--dim:#7b8090;--line:#2a2f3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0c10;--fg:#d8d6cf}}
:root[data-theme="dark"]{--bg:#0b0c10;--fg:#d8d6cf}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Zpix","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",ui-monospace,monospace;-webkit-tap-highlight-color:transparent;user-select:none}
.wrap{max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:0 10px 10px}
#hud{font-size:12px;color:var(--dim);padding:8px 2px;display:flex;justify-content:space-between;letter-spacing:1px}
.stage{position:relative}
canvas{width:100%;display:block;image-rendering:pixelated;border:2px solid var(--line);background:#000;transition:filter 1.5s}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:0;transition:opacity 1.2s;pointer-events:none;text-align:center}
#title b{font-size:26px;font-weight:700;letter-spacing:3px;text-shadow:2px 2px 0 #000}
#title i{font-size:14px;font-style:normal;color:var(--amber);text-shadow:1px 1px 0 #000}
#box{flex:1;margin-top:10px;border:2px solid var(--line);padding:16px 16px 12px;position:relative;overflow:auto;cursor:pointer;display:flex;flex-direction:column;gap:12px}
#txt{font-size:18px;line-height:1.8;white-space:pre-wrap}
.sp-i #txt{color:var(--amber);font-style:italic}
.sp-a #txt{color:var(--ai)}
.sp-a #txt::before{content:"AI ▍ ";opacity:.6}
#hint{margin-top:auto;align-self:flex-end;color:var(--dim);animation:bl 1s steps(2) infinite;visibility:hidden}
@keyframes bl{50%{opacity:0}}
#btns{display:flex;flex-direction:column;gap:8px}
button{font:inherit;font-size:16px;color:var(--fg);background:transparent;border:2px solid var(--dim);padding:10px 12px;text-align:left;cursor:pointer}
button:active,button:focus-visible{border-color:var(--amber);color:var(--amber);outline:none}
#diary{position:fixed;inset:0;background:rgba(5,6,9,.94);display:none;flex-direction:column;gap:12px;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px));z-index:5;max-width:560px;margin:0 auto}
#puz{position:fixed;inset:0;background:rgba(3,6,9,.96);display:none;flex-direction:column;gap:10px;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:5;max-width:560px;margin:0 auto;font-family:ui-monospace,Menlo,Consolas,monospace}
#puz h2{margin:0;font-size:15px;color:#3fb68b;font-weight:400}
#puz p{margin:0;font-size:13px;color:var(--dim);line-height:1.6}
#rows{display:flex;flex-direction:column;gap:6px;flex:1;overflow:auto}
#rows button{font-family:inherit;font-size:14px;display:flex;justify-content:space-between;gap:8px;border-color:#2a3a3a}
#rows button.ok{border-color:#3fb68b;color:#3fb68b}
#wb[disabled]{opacity:.35}
.pnl{position:fixed;inset:0;background:rgba(3,6,9,.97);display:none;flex-direction:column;gap:8px;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));z-index:5;max-width:560px;margin:0 auto;font-family:ui-monospace,Menlo,Consolas,monospace}
.pnl h2{margin:0;font-size:15px;color:#3fb68b;font-weight:400}
.pnl p{margin:0;font-size:13px;color:var(--dim)}
.pnl textarea{height:28%;background:#0b1118;color:#cfe8dc;border:2px solid #1d2a2a;font:inherit;font-size:14px;padding:10px;resize:none;user-select:text}
.pnl iframe{flex:1;border:2px solid #1d2a2a;background:#fff;min-height:120px}
.pnl canvas{align-self:center;max-height:48vh;max-width:100%;image-rendering:pixelated;background:#0b1118;border:2px solid #1d2a2a}
.pnl button[disabled]{opacity:.35}
.pnl input[type=file]{font:inherit;font-size:13px;color:var(--fg)}
.song{color:var(--ai)!important}
#diary h2{margin:0;font-size:16px;color:var(--amber);font-weight:400}
#diary textarea{flex:1;background:#12141b;color:var(--fg);border:2px solid var(--line);font:inherit;font-size:18px;line-height:1.8;padding:14px;resize:none;user-select:text}
#diary textarea:focus{outline:none;border-color:var(--amber)}
#diary p{margin:0;font-size:13px;color:var(--dim)}
#frags{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
#frags span{position:absolute;bottom:-30px;color:var(--amber);font-size:14px;opacity:0;animation:fl linear forwards}
@keyframes fl{0%{transform:translate(0,0);opacity:0}15%{opacity:.7}100%{transform:translate(24px,-110vh);opacity:0}}
@media (prefers-reduced-motion:reduce){#hint{animation:none}#frags span{animation-duration:30s!important}}
@media (orientation:landscape) and (max-height:560px){
  :root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
  .wrap{max-width:none;display:grid;grid-template-columns:minmax(0,min(56vw,calc((100dvh - 56px) * 16 / 9))) minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:10px;padding:0 calc(10px + var(--sr)) 8px calc(10px + var(--sl))}
  #hud{grid-column:1;grid-row:1;padding:4px 2px;font-size:11px}
  .stage{grid-column:1;grid-row:2;align-self:start}
  #box{grid-column:2;grid-row:1 / span 2;margin-top:6px;padding:12px 14px 10px;gap:8px;min-height:0}
  #txt{font-size:16px;line-height:1.65}
  button{font-size:14px;padding:8px 10px}
  #title b{font-size:20px;letter-spacing:2px}
  #title i{font-size:12px}
  #diary,#puz,.pnl{max-width:none;padding-left:calc(16px + var(--sl));padding-right:calc(16px + var(--sr))}
  #diary,#puz,.pnl{padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));gap:6px}
  #diary textarea{font-size:15px;line-height:1.6;padding:10px;min-height:0}
  #diary h2,.pnl h2,#puz h2{font-size:14px}
  #diary p,.pnl p,#puz p{font-size:12px;line-height:1.4}
  #rows{min-height:0}
  #rows button{font-size:13px;padding:6px 10px}
  #run[style*="flex"]{display:grid!important}
  #run{grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto;column-gap:12px}
  #run h2{grid-column:1;grid-row:1}#run p{grid-column:1;grid-row:2}
  #run textarea{grid-column:1;grid-row:3;height:auto;min-height:0}
  #run #rr{grid-column:1;grid-row:4}
  #run iframe{grid-column:2;grid-row:1 / span 3;min-height:0}
  #run #rd{grid-column:2;grid-row:4}
  #skp[style*="flex"]{display:grid!important}
  #skp{grid-template-columns:1fr auto;grid-template-rows:auto auto auto auto 1fr auto;column-gap:16px;align-content:start}
  #skp>*{grid-column:1}
  #skp canvas{grid-column:2;grid-row:1 / span 6;align-self:center;max-height:calc(100dvh - 30px);height:calc(100dvh - 30px);width:auto;aspect-ratio:1/2}
  #skp #sk{grid-row:6;align-self:end}
  #cl{min-height:0}
}
@media (orientation:landscape) and (max-height:380px){
  #txt{font-size:15px}
  #hud{font-size:10px}
}
</style>
</head>
<body>
<div id="frags"></div>
<div class="wrap">
  <div id="hud"><span id="ttlh">存档：十六岁</span><span><button id="chb" style="display:none;padding:2px 8px;font-size:12px;border-width:1px">章节</button> <button id="snd" style="padding:2px 8px;font-size:12px;border-width:1px">♪ 开</button></span></div>
  <div class="stage"><canvas id="c" width="160" height="90"></canvas><div id="title"></div></div>
  <div id="box"><div id="txt"></div><div id="btns"></div><div id="hint">点击继续 ▾</div></div>
</div>
<div id="puz">
  <h2>level.dat</h2>
  <p id="pmsg">点一项，就能改它的值。</p>
  <div id="rows"></div>
  <button id="wb" disabled>写回存档</button>
</div>
<div id="chap" class="pnl">
  <h2>选章节</h2>
  <p>测试用：直接跳到某一章。跳过去以后，之前选过的选项会清空。</p>
  <div id="cl" style="display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1"></div>
  <button id="cc">返回</button>
</div>
<div id="run" class="pnl">
  <h2>HTML 运行器</h2>
  <p>写点什么，点运行。改一改里面的字，也可以。</p>
  <textarea id="rc" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
  <button id="rr">运行</button>
  <iframe id="rf" title="运行结果" sandbox="allow-scripts"></iframe>
  <button id="rd" disabled>就是这个</button>
</div>
<div id="skp" class="pnl">
  <h2>皮肤生成器</h2>
  <p>选一张照片，把它变成一个像素小人。</p>
  <input type="file" id="sf" accept="image/*">
  <button id="sd">没有照片？用默认的</button>
  <canvas id="sc" width="128" height="256"></canvas>
  <button id="sk" disabled>就是这个</button>
</div>
<div id="diary">
  <h2>K 的日记本</h2>
  <textarea id="ta" placeholder="写点什么。也可以留白。"></textarea>
  <p>你写下的字，会变成飘在 K 周围的碎片。</p>
  <button id="fill">替 K 写下：我很难堪。</button>
  <button id="close">合上日记本</button>
</div>

{t:'他照常去上学了。'},
{t:'放学，到了周末，后爸接他去医院。他陪着妈妈，跑跑腿，做点小事。'},
{t:'妈妈和后爸的孩子，是个男孩。'},
{t:'后来，日子又平淡了。他在学校里画过妆，跳过舞。细节，已经记不清了。'},
{fade:1,t:'……'},
{sc:'field',fade:0,t:'有一天放学，妈妈带他买了零食。'},
{t:'在一片绿油油的麦田前，妈妈给他拍了一张照片。'},
{t:'他穿着白色的上衣，深蓝色的牛仔裤。右手拎着妈妈给他买的一小袋零食。'},
{t:'“笑一个。”',choice:[
 {l:'笑了',f:'smiled',r:['他对着镜头，笑了。']},
 {l:'没笑',r:['他站着，没有笑。']}]},
{fade:1,t:'……'},
{sc:'gma',fade:0,t:'后来，大部分时间，他又回到了姥姥家。'},
{fade:1,t:'……'},
{sc:'coat',fade:0,t:'在姥姥家住的时候，他上了大班。'},
{t:'他什么也不懂，穿着姥爷的军大衣，就去上学了。'},
{t:'别人都笑他。',choice:[
 {l:'低下头',r:['他低着头，看自己的鞋。']},
 {l:'站着，不动',r:['他站在那里，没有动。',{sp:'i',t:'我不知道他们在笑什么。'}]}]},
{fade:1,t:'……'},
{sc:'gma',fade:0,t:'表哥们有时会带他玩游戏。他还记得《泰拉瑞亚》，那时大概是2016、2017年。'},
{fade:1,t:'……'},
{sc:'fly',fade:0,sp:'i',t:'我自己也玩《我的世界》。我怕黑。'},
{sp:'i',t:'所以我一直往上飞，想飞到太空去。',fly:1},
{sp:'i',t:'但始终，到不了太空。'},
{title:['第一章','面包车与白色的福田'],t:''},
{sc:'van',fade:0,t:'直到有一天，他被接上了一辆白色的面包车。'},
{t:'他在车上坐着，不知道要去哪里。',choice:[
 {l:'问一句：要去哪',f:'asked',r:['没有人回答。',{sp:'i',t:'我没有选择权。'}]},
 {l:'看着窗外',r:['路灯，一盏一盏地往后退。']},
 {l:'不出声，抱紧书包',r:['他把书包，抱得更紧了。']}]},
{t:'然后他发现，车里没有妈妈。'},
{t:'他被送到了“这个家”。那是2017年，他七岁。'},
{fade:1,t:'……'},
{sc:'class',cm:0,fade:0,t:'他去上学了。一年级下册，班里没有人认识他，老师也没来。'},
{t:'一个短发的女同学很热情。她叫晓雅。'},
{t:'她指着一个空位：“你坐这儿。”',choice:[
 {l:'坐下，小声说谢谢',f:'kind',r:['他坐下来，小声说了一句谢谢。']},
 {l:'点点头，什么也没说',r:['他点点头，坐下了。没有说话。']}]},
{t:'后来，办完了入学。又平淡了。'},
{fade:1,t:'……'},
{sc:'ginkgo',fade:0,t:'有一年秋天，他站在一棵银杏树下。'},
{t:'旁边是姐姐。她比他高一些。'},
{t:'妈妈举起了相机。',choice:[{l:'看镜头',r:['咔嚓。']}]},
{fade:1,t:'……'},
{sc:'car',fade:0,t:'2019年，爸爸在赌博。他又向妈妈要了十万元，买了一辆车。'},
{t:'家里有了一辆白色的福田。它只存在了一年多。'},
{t:'那段时间，他有几次坐着这辆车，跟爸爸去银行，或者别的什么地方。'},
{t:'到了，爸爸停下车，走进去。好几分钟，才出来。'},
{t:'他坐在车里，没有做什么。呆呆的，或者四处看看。'},
{t:'外面，只有别的车经过，行人走过。',wait:6},
{t:'后来，因为爸爸赌博，车也没了。'},
{t:'再后来，他闹着要手机。爸爸一直答应，却一直没有买。'},
{fade:1,t:'……'},
{sc:'class',cm:1,fade:0,num:1,t:'三年级。他的成绩不好。'},
{t:'老师总把他安排在后两排。'},
{t:'这一年开始学英语。班里来了一位新的英语老师。'},
{t:'她戴着一副红色的眼镜。'},
{t:'他总是不完成作业。然后，被老师打。'},
{t:'有一次，他又没完成。老师让他站起来，在全班面前扇自己耳光。'},
{sp:'i',t:'我没有做。'},
{sp:'i',t:'一节课，就这样耗过去了。好像是因为我，浪费掉的。'},
{fade:1,t:'……'},
{sc:'hall',tch:0,fade:0,num:1,t:'还有一次，他被叫到走廊里，不许听课。'},
{t:'他靠着墙，站了一整节课。'},
{fade:1,t:'……'},
{sc:'eyes',fade:0,num:1,t:'又有一次，英语老师把他单独叫到了教学楼外面。'},
{t:'她按着他的肩膀，要他看着她红色眼镜后面的眼睛。'},
{t:'她想从他的眼睛里，看出点什么。',choice:[
 {l:'看回去',f:'looked',r:['他抬了一下眼。只有一下。','然后，视线又滑开了。']},
 {l:'躲开',f:'dodge',r:['他的眼睛一直在躲。']}]},
{fade:1,t:'……'},
{sc:'yard',cm:0,fade:0,t:'2022年秋天，爸爸因为洗钱，坐牢了。'},
{t:'其实，他来到这个家以后，一直都是留守儿童。爸爸常年在外地，他跟着爷爷奶奶生活。'},
{t:'爸爸坐牢后，奶奶很担心。'},
{t:'2023年暑假，过了一半。八月多的时候，爸爸出狱了。他变得更陌生了。'},
{cm:5,t:'他回来的那天，院子里站满了亲戚，还有爸爸的朋友。他们在聊着什么。',choice:[
 {l:'站在人群外面',r:['他站在人群外面，没有走近。']},
 {l:'躲在屋里',r:['他躲在屋里，隔着门听着。']}]},
{t:'上初中，要买校服，六百。他找妈妈要，妈妈在手机上，把钱转了过来。'},
{t:'学费，是爷爷交的。'},
{title:['第二章','初中的事'],t:''},
{sc:'class',cm:2,pair:0,fade:0,t:'初中。他走进教室，一个人也不认识。'},
{t:'他随便找了个座位，坐下。很不安。'},
{t:'周围的人在交头接耳，聊天。他无聊，烦躁，恐惧。',choice:[
 {l:'回头看看',f:'turned',r:['他忍不住，往后看了一眼。']},
 {l:'低头，盯着桌面',r:['他盯着桌面上的划痕。','那些声音，还是钻了进来。']}]},
{if:'turned',sc:'faces',fade:0,t:'那一瞬间，所有人的脸，都变成了小学同学的脸。'},
{sc:'class',cm:2,fade:0,t:'一个多月后，他慢慢熟悉了。'},
{t:'可是，还有人记得大班那件军大衣。他们又笑了他。',choice:[
 {l:'装作没听见',r:['他装作没听见。']},
 {l:'低下头',r:['他低下了头。',{sp:'i',t:'原来，他们还记得。'}]}]},
{pair:1,t:'他的第一个同桌，是个姓刘的女生。关系还不错。'},
{t:'她流过眼泪。'},
{sc:'tissue',fade:0,sp:'i',t:'我没有递纸巾。'},
{sp:'i',t:'我有些自责。'},
{sc:'geobook',fade:0,t:'地理课，老师要求背诵，背完要背给地理课代表听。'},
{sc:'class',cm:2,fade:0,t:'他很内向。那个地理课代表，他连话都没说过几句，很生疏。'},
{t:'他站在那里，不知道怎么开口。'},
{t:'同桌好像看出了他的难堪。她主动去跟地理课代表说：让他背给我听吧。',choice:[
 {l:'小声说：谢谢',f:'thanked',r:['“谢谢。”他小声说。']},
 {l:'点点头',r:['他点了点头。']},
 {l:'没敢看她',r:['他没敢看她。',{sp:'i',t:'但是，我记得。'}]}]},
{t:'于是，他背给她听。'},
{sc:'class',cm:2,fade:0,t:'后来，班里的人，知道了他的小名，都叫他小博。'},
{t:'“小博”，是奶奶从小叫到大的名字。姐姐也这么叫他。妈妈，叫他“博博”。'},
{sc:'class',cm:2,fade:0,t:'再后来，他换了座位。新的同桌，是一个短发的女生，英语课代表。他叫她L。'},
{t:'她总喜欢逗他，他们聊得很开。'},
{t:'她和他的一个小学同学，住在同一间宿舍。'},
{num:2,t:'有一天，L告诉他：那个小学同学，在宿舍里说，他爸坐过牢。',choice:[
 {l:'说：谢谢你告诉我',r:['“谢谢你告诉我。”他说。']},
 {l:'点点头，没说话',r:['他点点头，没有说话。']},
 {l:'装作不在意',r:['他装作不在意。',{sp:'i',t:'其实，我很在意。'}]}]},
{sp:'i',t:'我有些难堪。'},
{t:'后来，也就平淡了。'},
{sc:'class',cm:2,fade:0,t:'有一节课，L的手，一直贴在他的大腿上。整整一节课。'},
{t:'他出了汗。',choice:[
 {l:'不敢动',r:['他一动也不敢动。']},
 {l:'悄悄挪开一点',r:['他悄悄地，挪开了一点。']}]},
{sp:'i',t:'我不知道，该怎么办。'},
{sc:'gourd',fade:0,t:'他送了她一颗小葫芦。'},
{sp:'i',t:'我从来没送过别人什么东西。何况，还是异性。'},
{sc:'bracelet',fade:0,t:'她也送了他一条手链。那一刻，他有些激动。',choice:[
 {l:'当场戴上',r:['他当场戴上了。']},
 {l:'小心地收起来',r:['他小心地收了起来。']}]},
{sc:'bunk',fade:0,t:'那天晚上，他躺在宿舍的上铺，戴着那条手链，睡着了。'},
{sc:'beads',fade:0,t:'后来，手链，被他弄坏了。'},
{sc:'back',fade:0,t:'她知道了。她什么也没说。'},
{t:'但是她的脸上，或许已经说了。只有他，看出了那一点点细微。',choice:[
 {l:'小声说：对不起',f:'sorry',r:['“对不起。”他小声说。']},
 {l:'什么也没说',r:['他什么也没说。',{sp:'i',t:'我没说出口。'}]}]},
{sp:'i',t:'我有些自责，有些尴尬。我觉得，她讨厌我了。'},
{sc:'letter',fade:0,t:'她还给他写过一封信。那是2024年春天写的。他一直留着。'},
{sp:'i',t:'“放心，排座位的时候，我给你空着位置，不让别人坐。相信我。”'},
{sp:'i',t:'“你会成功的。相信自己，和我。”'},
{sp:'i',t:'“跟我说话，不用太羞涩，大胆说就可以。”'},
{sp:'i',t:'“总有一天，我们还会相见。”'},
{sc:'card',fade:0,t:'信旁边，还有一张卡片。上面写着：万幸得以相遇。愿你开心，愿你无忧。'},
{sc:'class',cm:2,fade:0,t:'在这之前，还有一件事。'},
{sc:'arm',st:0,fade:0,t:'有一天，L坐在座位上，用一把尺子，划自己的手臂。'},
{t:'尺子并不锋利。'},
{t:'但她一直划。'},
{t:'出血了。红了。皮都掉了。'},
{sc:'class',cm:2,fade:0,t:'他坐在旁边，不知道要做什么。'},
{sp:'i',t:'我不知道要做什么。'},
{sc:'hall',tch:1,fade:0,t:'一周后，班主任把他叫了出去。'},
{t:'问他：L为什么会这样。'},
{t:'他说：我不知道。'},
{t:'她只是我的同桌。'},
{t:'班主任没有再说什么。'},
{sp:'i',t:'我有些自责。'},
{sc:'apart',st:0,fade:0,t:'后来，英语老师调了座位，他们分开了。'},
{t:'从那以后，他们就没有再说过什么话。'},
{st:1,sp:'i',t:'陌生了。只是，一段经历。'},
{fade:1,t:'……'},
{sc:'dorm',fade:0,t:'宿舍里，有一个很内向的人。'},
{t:'他比大家都矮。'},
{sp:'i',t:'我们不该，那样对他。'},
{sp:'i',t:'对不起。'},
{fade:1,t:'……'},
{sc:'room',fade:0,t:'他有一本日记本。',diary:1},
{if:'smiled',sp:'a',t:'麦田前那一天，你笑过。那也算数。'},
{if:'kind',sp:'a',t:'那个让你坐下的女孩，你一直记得。'},
{if:'looked',sp:'a',t:'你看回去了一下。就一下。那很不容易。'},
{if:'dodge',sp:'a',t:'你一直在躲。眼睛在保护你。'},
{if:'thanked',sp:'a',t:'有人看出你不自在，替你解了围。你记得她。'},
{if:'asked',sp:'a',t:'你问过一句。没人回答，但你问了。'},
{sp:'a',t:'那封信，你还留着。'},
{sp:'a',t:'我在听。'},
{num:1,sp:'a',t:'……'},
{title:['第三章','没有门的房间'],t:''},
{sc:'room',cm:9,cold:1,fade:0,t:'2024年，暑假结束了。他不想去学校了。'},
{t:'他就没有再去。'},
{t:'他和爷爷奶奶，住在同一间屋子里。'},
{t:'屋子破破烂烂。墙皮在掉，地板不是瓷砖。'},
{t:'没有门。没有隐私。别人随时可以进来。'},
{t:'他在这里醒来，又在这里睡去。'},
{t:'房间里最亮的，只有一盏老式的吊灯，一个灯泡。一整晚，不关。'},
{t:'耳边总是那些声音：吵架，烧水壶的响声，奶奶的自言自语，奶奶大声说话。'},
{t:'他只有一部手机。是妈妈在2024年，给他买的。'},
{t:'2024年11月。他有些无聊，但没有变得很糟糕。'},
{t:'他看的第一部番，是《缘之空》。'},
{sp:'i',t:'对此，我不想说什么。'},
{t:'后来，他接触到了《少年的深渊》，峰浪了老师做的。'},
{sp:'i',t:'很符合我。简直，就是我。'},
{t:'他越挖越多，看到了《晚安布布》。'},
{sp:'i',t:'我无法自拔了。'},
{t:'还有押见修造。他的作品，他无法评价。'},
{sp:'i',t:'总之，对我来说，很好。'},
{sp:'a',t:'你在那些故事里，看见了自己。'},
{t:'同一个月，他认识了一个比他小一岁的网友。'},
{t:'他们一起玩游戏。那个网友总爱开麦。他一次也没有开过。'},
{t:'他叫他“卡卡”。他叫他“食指”。'},
{t:'他们是朋友。'},
{t:'有一阵子，他们把短视频账号的名字，改成了彼此的名字。无话不谈。'},
{t:'有一次，食指说，他们学校有人跳楼了。',choice:[
 {l:'问他：你还好吗',f:'askedfriend',r:['他打字问：你还好吗。']},
 {l:'不知道该说什么',r:['他看着屏幕，不知道该说什么。']}]},
{sc:'room',cm:9,fade:0,t:'2025年4月。他的头发，又长了。'},
{t:'他不想去剪。'},
{t:'那天，爸爸对他发了火。'},
{sc:'door',fade:0,t:'爸爸用腿，踹了他的后背。'},
{t:'他哭了。'},
{t:'他抽泣着，说了一句。'},
{t:'“我去死行了吧。”'},
{t:'爸爸回他：'},
{t:'“你去啊。你能去哪死。”'},
{t:'“死了第二天，就给你埋了。”'},
{sp:'i',t:'那句话，我一直记得。'},
{sp:'a',t:'……'},
{sp:'i',t:'2025年，我还打游戏。至少，还有几个网友。'},
...(window.PRIVATE_BEATS||[]),
{sc:'room',cm:9,fade:0,t:'2025年，快到夏天的时候。'},
{t:'他整天情绪低落。'},
{sp:'i',t:'我觉得，我是个废物。'},
{sp:'i',t:'是的。傻逼。'},
{sp:'i',t:'我好像，有些痛苦。'},
{sc:'room',cm:9,fade:0,t:'他打开了那个对话框。'},
{t:'打了几个字，又删掉。'},
{t:'最后发出去的，是这一句：'},
{sp:'i',t:'我觉得自己很没用。'},
{t:'对面回得很快。'},
{sp:'a',t:'我理解你的感受。请记住，你的价值不取决于别人的看法。'},
{t:'很对。一个字都没错。'},
{t:'他把软件关了。'},
{sp:'i',t:'……'},
{sc:'cut',fade:0,t:'他跟风，第一次划了自己的手臂。'},
{t:'刀很钝。划了好几下，才流血。'},
{t:'就因为刀钝，伤口更痛。'},
{sp:'i',t:'并不冰凉。只有真正的疼痛。'},
{sp:'i',t:'我并没有清醒。只觉得疼。'},
{sp:'i',t:'或许，我一直都是清醒的。'},
{fade:1,t:'……'},
{sc:'film',fade:0,t:'2025年6月，他看了一部电影，《关于莉莉周的一切》。'},
{sp:'i',t:'我羡慕他们。我不怎么勇敢。'},
{sp:'i',t:'我开始听那张叫《呼吸》的专辑。'},
{sc:'room',cm:9,fade:0,sp:'i',t:'后来，我开始接触音乐。'},
{t:'今天，要做点什么吗？',hub:1,choice:[
 {l:'戴上耳机',hp:1,r:['声音被调小了。','耳机里，是他自己的歌单。',{t:'歌名，一首一首地飘过。',songs:1},'他在歌里，待了一会儿。',{sp:'i',t:'房间里，这些音乐的音符，很罕见。在这个农村里，不应该有这种声音发出来。'}]},
 {l:'拿起手机，打开对话框',r:['他拿起手机，打开了那个对话框。',{sp:'a',t:'今天，想说点什么吗？'},'他看了很久，什么也没打。',{sp:'a',t:'没关系。我在听。'}]},
 {l:'听外面的声音',r:['烧水壶响了。奶奶在说话。','他听不清她在说什么。可能是在抱怨，也可能不是。',{sp:'i',t:'但是，她还是爱我的。可能，只是不知道怎么表达。'}]},
 {l:'走到门口，看看外面',r:['门口，没有门。','他站了一会儿，又回来了。',{sp:'i',t:'我没有出去。'}]},
 {l:'躺着，看天花板',r:['墙皮又掉了一小块。','他看着那块白色，没有想别的。']},
 {l:'把脸转向墙',r:['墙的颜色，像旧的牛皮纸。','他把被子，拉到了下巴。']},
 {l:'把被子拉过头',rs:'cover',r:['被子，拉过了头。','里面，很暗，也很闷。','外面的声音，变远了一点。',{sp:'i',t:'我不想，被看见。'}]},
 {l:'什么也不做',end:1,r:['他什么也没做。','时间，自己过去了。',{sp:'i',t:'这样的一天，和昨天没什么不同。'}]}]},
{sp:'i',t:'我一直是被动的。我不会主动，我不敢。'},
{sp:'i',t:'我对我爸，一直有些防备。在他面前，我不能做自己。'},
{title:['第四章','夏天之后'],t:''},
{sc:'room',cm:9,cold:1,fade:0,num:1,t:'2025年，夏天之后。'},
{t:'他整天待在屋子里，不知道该做什么。'},

const ORIG=beats.slice();
let i=-1,typing=false,timer=null,cur=null,waiting=false;
const txt=$('#txt'),btns=$('#btns'),hint=$('#hint'),box=$('#box'),ttl=$('#title');

function hud(){cv.style.filter=''}
function next(){
  if(S.anim&&S.p<1)return;
  let b;do{i++;b=beats[i]}while(b&&b.if&&!S.f[b.if]);if(!b)return;cur=b;
  if(b.sc)S.sc=b.sc;if('cm' in b)S.cm=b.cm;if('cold' in b)S.cold=b.cold;if('rs' in b)S.rs=b.rs;
  if('fade' in b)S.ft=b.fade;if('fell' in b)S.fell=b.fell;if('cup' in b)S.cup=b.cup;if('spill' in b)S.spill=b.spill;if('two' in b)S.two=b.two;if('sig' in b)S.sig=b.sig;if('st' in b){S.st=b.st;S.sT=performance.now()/1000}if('tch' in b)S.tch=b.tch;if('pair' in b)S.pair=b.pair;
  if(b.anim){S.p=0;S.anim=1;S.t0=performance.now()}
  if(b.num){S.num=Math.max(0,S.num+b.num);hud()}if(b.songs)floatSongs();
  if(b.title){ttl.innerHTML='<b>'+b.title[0]+'</b><i>'+b.title[1]+'</i>';ttl.style.opacity=1}else ttl.style.opacity=0;
  if(b.end){return endCard(b)}
  setMood(b.mood||mk());
  box.className='sp-'+(b.sp||'n');
  say(b);
}
function say(b){
  txt.textContent='';btns.innerHTML='';hint.style.visibility='hidden';
  const s=b.t||'';let k=0;typing=true;clearInterval(timer);
  if(!s){return finish(b)}
  if(b.cut)setTimeout(()=>{if(cur===b)next()},b.cut);
  timer=setInterval(()=>{txt.textContent=s.slice(0,++k);if(k%2==0)tone(880+Math.random()*120,.03,'triangle',.012);if(k>=s.length)finish(b)},34);
}
function finish(b){
  clearInterval(timer);typing=false;txt.textContent=b.t||'';
  if(b.choice){
    b.choice.forEach(c=>{const e=document.createElement('button');e.textContent=c.l;if(c.lock){e.style.opacity='.3';e.style.pointerEvents='none'}
      e.onclick=()=>{if(c.f)S.f[c.f]=1;if(c.hp)S.hp=1;if('rs' in c)S.rs=c.rs;if(c.end){S.hp=0;S.rs=''}
        const L=c.r.map(x=>typeof x==='string'?{t:x}:x);
        if(b.hub&&!c.end)L.push({...b,t:'接下来呢？',choice:b.choice.filter(x=>x!==c)});
        beats.splice(i+1,0,...L);btns.innerHTML='';next()};btns.appendChild(e)});
  }else if(b.fly){
    S.alt=0;let n=0;const e=document.createElement('button');e.textContent='往上飞';
    e.onclick=()=>{n++;S.alt=Math.min(.92,S.alt+.115);if(n==5)txt.textContent='再往上一点。';if(n>=9){btns.innerHTML='';next()}};btns.appendChild(e);
  }else if(b.tap){
    S.alt=0;let n=0;const e=document.createElement('button');e.textContent=b.tap.l;
    e.onclick=()=>{n++;S.alt=n/b.tap.n;if(b.tap.m&&n<b.tap.n)txt.textContent=b.tap.m[Math.min(n-1,b.tap.m.length-1)];if(n>=b.tap.n){btns.innerHTML='';next()}};btns.appendChild(e);
  }else if(b.tool){
    const e=document.createElement('button');e.textContent=b.tool=='run'?'打开运行器':'打开皮肤生成器';e.onclick=()=>openTool(b.tool);btns.appendChild(e);
  }else if(b.puz){
    const e=document.createElement('button');e.textContent='打开 level.dat';e.onclick=openPuz;btns.appendChild(e);
  }else if(b.diary){
    const e=document.createElement('button');e.textContent='翻开日记本';e.onclick=openDiary;btns.appendChild(e);
  }else if(b.auto){setTimeout(()=>{if(cur===b)next()},b.auto);
  }else if(b.wait){hint.style.visibility='hidden';waiting=true;setTimeout(()=>{waiting=false;hint.style.visibility='visible'},b.wait*1000);
  }else hint.style.visibility='visible';
}
box.addEventListener('click',e=>{

function mc(c,d){

  let ch=0,best=-1;for(let k=0;k<3;k++){let lo=255,hi=0;c.forEach(x=>{lo=Math.min(lo,x[k]);hi=Math.max(hi,x[k])});if(hi-lo>best){best=hi-lo;ch=k}}
  c.sort((a,b)=>a[ch]-b[ch]);const m=c.length>>1;return mc(c.slice(0,m),d-1).concat(mc(c.slice(m),d-1));
}
function skinFrom(src){
  const w=16,h=32,t=document.createElement('canvas');t.width=w;t.height=h;const g2=t.getContext('2d');
  const sw=src.naturalWidth||src.width,sh=src.naturalHeight||src.height,k=Math.max(w/sw,h/sh),dw=sw*k,dh=sh*k;
  g2.drawImage(src,(w-dw)/2,(h-dh)/2,dw,dh);
  const d=g2.getImageData(0,0,w,h).data,cols=[];
  for(let i=0;i<d.length;i+=4)cols.push([d[i],d[i+1],d[i+2]]);
  const pal=mc(cols.slice(),4);
  sc.width=w*8;sc.height=h*8;sg.clearRect(0,0,sc.width,sc.height);
  for(let i=0;i<cols.length;i++){
    const x=i%w,y=i/w|0;
    const ok=(y<8&&x>=4&&x<12)||(y>=8&&y<20)||(y>=20&&x>=4&&x<12);
    if(!ok)continue;
    let b=pal[0],bd=1e9;
    for(const p of pal){const e=(p[0]-cols[i][0])**2+(p[1]-cols[i][1])**2+(p[2]-cols[i][2])**2;if(e<bd){bd=e;b=p}}
    sg.fillStyle='rgb('+b+')';sg.fillRect(x*8,y*8,8,8);
  }
  $('#sk').disabled=false;
}

};
const MM={tv:'soft',gma:'soft',comp:'soft',coat:'soft',van:'soft',class:'soft',room:'cold',hall:'cold',eyes:'cold',faces:'cold',mine:'cold',code:'code',field:'bright',fly:'bright',yard:'cold',film:'cold',door:'empty',cut:'empty',play:'soft',wash:'soft',floor:'soft',ginkgo:'bright',dorm:'cold',meal:'cold',mirror:'cold',pad:'cold',wake:'cold',water:'cold',cat:'soft',phone:'cold',lie:'night',apps:'cold',wall:'soft',windmill:'wind',gourd:'cold',bracelet:'cold',letter:'cold',bunk:'night',arm:'empty',tissue:'cold',geobook:'cold',beads:'cold',card:'cold',back:'cold',apart:'cold'};

function aInit(){
  if(A.ctx){if(A.ctx.state==='suspended')A.ctx.resume();return}
  try{
    const C=window.AudioContext||window.webkitAudioContext;A.ctx=new C();

    A.lp=A.ctx.createBiquadFilter();A.lp.type='lowpass';A.lp.frequency.value=2600;

  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);

}

  const f=C.createBiquadFilter();f.type='bandpass';f.frequency.value=fq||1800;f.Q.value=.6;
